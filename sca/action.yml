name: Snyk SCA scan
description: >
  Open source dependency scan (snyk test). Install your dependencies before calling this.

inputs:
  snyk-token:
    description: Snyk API token. Set it as a repo or org secret.
    required: true
  snyk-org:
    description: Snyk org slug or UUID. Only needed if your token spans orgs.
    default: ""
  monitor:
    description: >
      "true" publishes results to the Snyk Web UI so the platform tracks this
      project over time (trending, notifications on newly disclosed vulns,
      UI-managed ignores). Enable on default-branch pushes only, or every PR
      branch becomes a Snyk project.
    default: "false"
  monitor-required:
    description: >
      "true" (the default, and the historical behaviour) fails the check when
      the `snyk monitor` publish fails. Set "false" to downgrade a failed
      publish to a warning: the scan and its SARIF are what gate the branch,
      and `snyk monitor` exit 2 is documented as retryable.
    default: "true"
  target-reference:
    description: >
      Branch or version grouping for published snapshots, e.g. main. Ignored,
      with a warning, when extra-args contains --unmanaged: Snyk documents
      --target-reference on `snyk test` as unsupported with --unmanaged.
    default: ""
  remote-repo-url:
    description: >
      The Snyk TARGET this scan attaches to. Snyk's model is
      Org > Target > Project: each scan type always creates its OWN project,
      and the only thing that files them under one repo entry is an identical
      target. Pass the SAME value to the sca, code and iac actions or you get
      three unrelated entries. Empty defaults to this repo's URL, which is
      already identical across all three, so leave it alone unless you are
      splitting a monorepo into per-component targets.
    default: ""
  project-name:
    description: >
      Snyk project name for monitor. Empty auto-detects the manifest filename
      (package.json, pom.xml, go.mod, ...), because Snyk otherwise uses the
      root package name, which is why nodejs-goof appears as "goof". Skipped
      for multi-manifest scans: one name cannot cover many projects.
      SET THIS EXPLICITLY when working-directory is not "." and monitor is on.
      Two components that both auto-detect "package.json" collide on one
      project under a shared target and overwrite each other's snapshots.
    default: ""
  project-tags:
    description: >
      Comma-separated key=value tags applied to the published project, e.g.
      "app=nodejs-goof". Snyk will not put every scan type under one target
      from the CLI, so a shared tag is how you get one filtered view across
      SCA, Code, IaC and container. Documented for `snyk monitor`; needs a
      role that can edit project attributes, or the publish step fails.
    default: ""
  severity-threshold:
    description: "low | medium | high | critical. Findings below this are ignored."
    default: high
  fail-on-findings:
    description: >
      "true" fails this check when findings exist. Leave "false" and let the
      code scanning check do the blocking instead, or you gate twice.
    default: "false"
  upload-sarif:
    description: >
      "true" sends results to GitHub code scanning: PR diff annotations, new
      vs existing alert detection, and the alerts UI. Free on public repos;
      private repos need GitHub Code Security.
    default: "true"
  pr-comment:
    description: '"true" posts/updates one sticky comment on the PR.'
    default: "true"
  working-directory:
    description: Directory to scan. For monorepos.
    default: "."
  install-command:
    description: >
      Command run before the scan; `snyk test` scans RESOLVED dependencies,
      so they must be installed first. "auto" detects the ecosystem
      (npm/yarn/pnpm, pip/poetry/pipenv, Go, JVM) and installs with
      script-execution disabled where supported. "skip" runs nothing.
      Anything else runs verbatim in bash. It comes from the workflow
      author's file, so never build it from untrusted input.
    default: auto
  extra-args:
    description: >
      Extra Snyk CLI flags, appended verbatim and UNQUOTED, so a value
      containing spaces will word-split. Do not put secrets here: the value is
      echoed into the run log by the runner's own command tracing.
    default: ""
  comment-marker:
    description: >
      Identifies this scan's sticky comment and its code scanning category.
      Only change it if you call this action twice in one repo.
    default: snyk-sca
  snyk-cli-version:
    description: >
      A version like "1.1306.1", or "latest". Pinning is recommended for a
      gating workflow: "latest" means a CLI change can alter the gate's
      behaviour with no commit in this repo.
    default: latest
  verify-cli-gpg:
    description: >
      "true" also verifies the CDN's GPG-signed sha256sums.txt.asc against
      Snyk's published key fingerprint. The per-asset .sha256 gives integrity
      only, since it comes from the same origin as the binary.
    default: "false"
  github-token:
    description: Token used to read the PR and write the comment.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "Snyk CLI exit code: 0 clean, 1 findings, 2 error, 3 nothing to scan."
    value: ${{ steps.scan.outputs.code }}
  results-file:
    description: SARIF path, relative to working-directory.
    value: snyk-sca.sarif

runs:
  using: composite
  steps:
    - name: Check token
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if [ -z "$SNYK_TOKEN" ]; then
          echo "::error::snyk-token is empty. Set the SNYK_TOKEN secret on this repo or org."
          exit 1
        fi

    - name: Warn on debug flags in extra-args
      shell: bash
      env:
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        case " $EXTRA_ARGS " in
          *" -d "*|*" --debug "*|*DEBUG=*)
            echo "::warning::extra-args enables Snyk debug output. Debug logs are"
            echo "::warning::verbose and Snyk does not document them as redacted."
            echo "::warning::Do not use this on a public repo, where run logs are world-readable." ;;
        esac

    - name: Install Snyk CLI
      shell: bash
      env:
        SNYK_VERSION: ${{ inputs.snyk-cli-version }}
        SNYK_VERIFY_GPG: ${{ inputs.verify-cli-gpg }}
      run: bash "${{ github.action_path }}/../scripts/install-snyk.sh"

    # snyk test scans resolved dependencies; resolve them first.
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: bash "${{ github.action_path }}/../scripts/install-deps.sh"

    - name: SCA scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
        SNYK_CFG_ORG: ${{ inputs.snyk-org }}
        SEVERITY: ${{ inputs.severity-threshold }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        TARGET_REF: ${{ inputs.target-reference }}
        REPO_URL: ${{ inputs.remote-repo-url || format('{0}/{1}', github.server_url, github.repository) }}
      run: |
        set +e
        # Teed for diagnosis; PIPESTATUS keeps the real exit code.
        # EXTRA_ARGS is intentionally unquoted: it is a flag list.
        args=(--severity-threshold="$SEVERITY" --sarif-file-output="snyk-sca.sarif" --json-file-output="snyk-sca.json")

        # Without --fail-fast, `snyk test --all-projects` silently drops
        # projects it could not scan and still exits 0. Pass it yourself to
        # keep control of it.
        case " $EXTRA_ARGS " in
          *--all-projects*|*--yarn-workspaces*|*--all-sub-projects*)
            case " $EXTRA_ARGS " in
              *--fail-fast*) ;;
              *) args+=(--fail-fast)
                 echo "::notice::Multi-project scan: adding --fail-fast so a project that fails to resolve fails the check instead of being dropped." ;;
            esac ;;
        esac

        # Target context on the test, not just the monitor: Snyk applies the
        # matching target's ignores, so without it a PR re-reports UI ignores.
        args+=(--remote-repo-url="$REPO_URL")
        if [ -n "$TARGET_REF" ]; then
          case " $EXTRA_ARGS " in
            *--unmanaged*)
              echo "::warning::--target-reference is not supported with --unmanaged on snyk test; dropping it for this scan. UI ignores keyed on the target reference will not apply." ;;
            *) args+=(--target-reference="$TARGET_REF") ;;
          esac
        fi
        snyk test "${args[@]}" $EXTRA_ARGS 2>&1 | tee snyk-sca.log
        echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Monitor
      if: inputs.monitor == 'true' && (steps.scan.outputs.code == '0' || steps.scan.outputs.code == '1')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
        SNYK_CFG_ORG: ${{ inputs.snyk-org }}
        TARGET_REF: ${{ inputs.target-reference }}
        REPO_URL: ${{ inputs.remote-repo-url || format('{0}/{1}', github.server_url, github.repository) }}
        PROJECT_NAME: ${{ inputs.project-name }}
        TAGS: ${{ inputs.project-tags }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        WORKDIR: ${{ inputs.working-directory }}
        MONITOR_REQUIRED: ${{ inputs.monitor-required }}
      run: |
        set +e
        # --remote-repo-url is the only grouping key shared by snyk monitor,
        # snyk code test and snyk iac test. Do not add --target-name.
        args=(--remote-repo-url="$REPO_URL")
        [ -n "$TARGET_REF" ] && args+=(--target-reference="$TARGET_REF")
        case " $EXTRA_ARGS " in
          *--all-projects*|*--yarn-workspaces*|*--all-sub-projects*)
            # Snyk names each project after its own manifest already.
            multi=true ;;
          *) multi=false ;;
        esac
        if [ "$multi" = "false" ]; then
          if [ -z "$PROJECT_NAME" ]; then
            for f in package.json pom.xml build.gradle build.gradle.kts build.sbt \
                     requirements.txt Pipfile pyproject.toml setup.py go.mod Gemfile \
                     composer.json mix.exs Package.swift Podfile paket.dependencies; do
              [ -f "$f" ] && PROJECT_NAME="$f" && break
            done
            [ -n "$PROJECT_NAME" ] || PROJECT_NAME=$(ls -1 *.sln *.csproj 2>/dev/null | head -n1)
            # Detection is filename-only, so two components under one target
            # both become "package.json" and overwrite each other. Warn rather
            # than rename: a new default re-forks every existing project.
            if [ -n "$PROJECT_NAME" ] && [ "$WORKDIR" != "." ] && [ -n "$WORKDIR" ]; then
              echo "::warning::project-name auto-detected as '${PROJECT_NAME}' for working-directory '${WORKDIR}'. Manifest filenames repeat across components; set project-name explicitly (e.g. '${WORKDIR}/${PROJECT_NAME}') or these components will collide on one Snyk project."
            fi
          fi
          [ -n "$PROJECT_NAME" ] && args+=(--project-name="$PROJECT_NAME")
        elif [ -n "$PROJECT_NAME" ]; then
          echo "::warning::project-name ignored for a multi-manifest scan."
        fi
        [ -n "$TAGS" ] && args+=(--project-tags="$TAGS")
        snyk monitor "${args[@]}" $EXTRA_ARGS
        code=$?
        # snyk monitor: 0 success, 2 failure, 3 nothing to monitor. No 1.
        if [ "$code" = "0" ]; then
          exit 0
        fi
        msg="SCA: could not publish the snapshot to Snyk (exit ${code}). The scan and its SARIF are unaffected."
        if [ "$MONITOR_REQUIRED" = "true" ]; then
          echo "::error::${msg} Set monitor-required: \"false\" to downgrade this to a warning."
          exit 1
        fi
        echo "::warning::${msg}"

    - name: Diagnose
      id: diag
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLASSIFY_LOG: snyk-sca.log
        CLASSIFY_EXIT: ${{ steps.scan.outputs.code }}
        CLASSIFY_SCAN: SCA
      run: python3 "${{ github.action_path }}/../scripts/classify.py"

    - name: Report
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TITLE: Snyk SCA (${{ inputs.severity-threshold }}+)
        FILE: snyk-sca.sarif
        EXIT_CODE: ${{ steps.scan.outputs.code }}
        MARKER: ${{ inputs.comment-marker }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        ERROR_MESSAGE: ${{ steps.diag.outputs.message }}
        ERROR_HINT: ${{ steps.diag.outputs.hint }}
      run: bash "${{ github.action_path }}/../scripts/report.sh"

    # --all-projects writes one run per manifest, and code scanning rejects
    # two runs in one category. The script assigns a unique
    # automationDetails.id per run and enforces the upload limits first.
    - name: Prepare SARIF
      if: always() && inputs.upload-sarif == 'true'
      shell: bash
      id: sarif
      working-directory: ${{ inputs.working-directory }}
      env:
        SARIF_FILE: snyk-sca.sarif
        SARIF_CATEGORY: ${{ inputs.comment-marker }}
      run: python3 "${{ github.action_path }}/../scripts/sarif-prep.py"

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.sarif.outputs.ok == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.working-directory }}/snyk-sca.sarif
        # Must be unique per scan: code scanning allows one analysis per category.
        category: ${{ inputs.comment-marker }}
        checkout_path: ${{ github.workspace }}/${{ inputs.working-directory }}
        token: ${{ inputs.github-token }}

    - name: Gate
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.code }}
        MESSAGE: ${{ steps.diag.outputs.message }}
        HINT: ${{ steps.diag.outputs.hint }}
        FAIL_ON: ${{ inputs.fail-on-findings }}
        SEVERITY: ${{ inputs.severity-threshold }}
      run: |
        # Fail closed: only 0, 1 and 3 are known-good. An unset code fails.
        case "${CODE:-none}" in
          0)
            echo "SCA: clean." ;;
          3)
            echo "SCA: nothing to scan." ;;
          1)
            if [ "$FAIL_ON" = "true" ]; then
              echo "::error::SCA: findings at ${SEVERITY}+ severity."; exit 1
            fi
            echo "SCA: findings reported, not gated here." ;;
          *)
            echo "::error::${MESSAGE:-SCA: scan failed (exit ${CODE:-unknown}).} ${HINT}"
            exit 1 ;;
        esac
