name: Snyk IaC scan
description: >
  Infrastructure-as-code scan (snyk iac test). Do NOT install dependencies in this job: IaC walks the whole tree and chokes on malformed JSON in node_modules.

inputs:
  detection-depth:
    description: >
      How many subdirectory levels to search. `snyk iac test` has no --exclude
      flag (unlike `snyk test`, which does), so this is the only way to stop it
      reaching into vendored directories.
    default: ""
  snyk-token:
    description: Snyk API token. Set it as a repo or org secret.
    required: true
  snyk-org:
    description: Snyk org slug or UUID. Only needed if your token spans orgs.
    default: ""
  monitor:
    description: >
      "true" publishes results to the Snyk Web UI so the platform tracks this
      project over time (trending, notifications on newly disclosed vulns,
      UI-managed ignores). Enable on default-branch pushes only, or every PR
      branch becomes a Snyk project. Cannot be combined with a --rules custom
      bundle in extra-args; Snyk documents --report and --rules as mutually
      exclusive, and this action fails fast rather than letting the CLI decide.
    default: "false"
  target-reference:
    description: Branch or version grouping for published snapshots, e.g. main.
    default: ""
  remote-repo-url:
    description: >
      The Snyk TARGET this scan attaches to. Snyk's model is
      Org > Target > Project: each scan type always creates its OWN project,
      and the only thing that files them under one repo entry is an identical
      target. Pass the SAME value to the sca, code and iac actions or you get
      three unrelated entries. Empty defaults to this repo's URL, which is
      already identical across all three, so leave it alone unless you are
      splitting a monorepo into per-component targets.
    default: ""
  project-tags:
    description: >
      Comma-separated key=value tags applied to the published project, e.g.
      "app=nodejs-goof". Snyk will not put every scan type under one target
      from the CLI, so a shared tag is how you get one filtered view across
      SCA, Code, IaC and container. Snyk documents `iac test` as FAILING when
      an option that sets project attributes is used and the role cannot edit
      project attributes.
    default: ""
  severity-threshold:
    description: "low | medium | high | critical. Findings below this are ignored."
    default: high
  fail-on-findings:
    description: >
      "true" fails this check when findings exist. Leave "false" and let the
      code scanning check do the blocking instead, or you gate twice.
    default: "false"
  upload-sarif:
    description: >
      "true" sends results to GitHub code scanning: PR diff annotations, new
      vs existing alert detection, and the alerts UI. Free on public repos;
      private repos need GitHub Code Security.
    default: "true"
  pr-comment:
    description: '"true" posts/updates one sticky comment on the PR.'
    default: "true"
  working-directory:
    description: Directory to scan. For monorepos.
    default: "."
  extra-args:
    description: >
      Extra Snyk CLI flags, appended verbatim and UNQUOTED, so a value
      containing spaces will word-split. Do not put secrets here.
    default: ""
  comment-marker:
    description: >
      Identifies this scan's sticky comment and its code scanning category.
      Only change it if you call this action twice in one repo.
    default: snyk-iac
  snyk-cli-version:
    description: >
      A version like "1.1306.1", or "latest". Pinning is recommended for a
      gating workflow.
    default: latest
  verify-cli-gpg:
    description: >
      "true" also verifies the CDN's GPG-signed sha256sums.txt.asc against
      Snyk's published key fingerprint.
    default: "false"
  github-token:
    description: Token used to read the PR and write the comment.
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "Snyk CLI exit code: 0 clean, 1 findings, 2 error, 3 nothing to scan."
    value: ${{ steps.scan.outputs.code }}
  results-file:
    description: SARIF path, relative to working-directory.
    value: snyk-iac.sarif

runs:
  using: composite
  steps:
    - name: Check token
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if [ -z "$SNYK_TOKEN" ]; then
          echo "::error::snyk-token is empty. Set the SNYK_TOKEN secret on this repo or org."
          exit 1
        fi

    - name: Validate options
      shell: bash
      env:
        EXTRA_ARGS: ${{ inputs.extra-args }}
        MONITOR: ${{ inputs.monitor }}
      run: |
        # --report and --rules are mutually exclusive; catching it here beats
        # an unclassified exit 2 mid-scan.
        case " $EXTRA_ARGS " in
          *--rules*)
            if [ "$MONITOR" = "true" ]; then
              echo "::error::monitor: \"true\" adds --report, which Snyk documents as incompatible with the --rules custom-rules bundle in extra-args. Choose one."
              exit 1
            fi ;;
        esac
        case " $EXTRA_ARGS " in
          *--target-name*)
            echo "::warning::--target-name in extra-args supersedes --remote-repo-url on snyk iac test, so IaC will land on a different Snyk target from the sca and code scans." ;;
        esac
        case " $EXTRA_ARGS " in
          *" -d "*|*" --debug "*|*DEBUG=*)
            echo "::warning::extra-args enables Snyk debug output. Debug logs are"
            echo "::warning::verbose and Snyk does not document them as redacted."
            echo "::warning::Do not use this on a public repo, where run logs are world-readable." ;;
        esac

    - name: Install Snyk CLI
      shell: bash
      env:
        SNYK_VERSION: ${{ inputs.snyk-cli-version }}
        SNYK_VERIFY_GPG: ${{ inputs.verify-cli-gpg }}
      run: bash "${{ github.action_path }}/../scripts/install-snyk.sh"

    - name: IaC scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
        SNYK_CFG_ORG: ${{ inputs.snyk-org }}
        SEVERITY: ${{ inputs.severity-threshold }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        MONITOR: ${{ inputs.monitor }}
        TARGET_REF: ${{ inputs.target-reference }}
        GH_REPO: ${{ github.repository }}
        REPO_URL: ${{ inputs.remote-repo-url || format('{0}/{1}', github.server_url, github.repository) }}
        DEPTH: ${{ inputs.detection-depth }}
        TAGS: ${{ inputs.project-tags }}
      run: |
        set +e
        args=(--severity-threshold="$SEVERITY" --sarif-file-output="snyk-iac.sarif")
        [ -n "$DEPTH" ] && args+=(--detection-depth="$DEPTH")
        # Do NOT add --target-name, here or via extra-args: it supersedes
        # --remote-repo-url and files IaC under a target of its own.
        if [ "$MONITOR" = "true" ]; then
          args+=(--report --remote-repo-url="$REPO_URL")
          [ -n "$TARGET_REF" ] && args+=(--target-reference="$TARGET_REF")
          [ -n "$TAGS" ] && args+=(--project-tags="$TAGS")
        elif [ -n "$TAGS" ]; then
          # Project-attribute options are documented only with --report.
          echo "::warning::project-tags is documented on snyk iac test only in combination with --report. Ignoring it because monitor is not enabled."
        fi
        snyk iac test "${args[@]}" $EXTRA_ARGS 2>&1 | tee snyk-iac.log
        echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Diagnose
      id: diag
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CLASSIFY_LOG: snyk-iac.log
        CLASSIFY_EXIT: ${{ steps.scan.outputs.code }}
        CLASSIFY_SCAN: IaC
      run: python3 "${{ github.action_path }}/../scripts/classify.py"

    - name: Report
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        TITLE: Snyk IaC (${{ inputs.severity-threshold }}+)
        FILE: snyk-iac.sarif
        EXIT_CODE: ${{ steps.scan.outputs.code }}
        MARKER: ${{ inputs.comment-marker }}
        PR_COMMENT: ${{ inputs.pr-comment }}
        ERROR_MESSAGE: ${{ steps.diag.outputs.message }}
        ERROR_HINT: ${{ steps.diag.outputs.hint }}
      run: bash "${{ github.action_path }}/../scripts/report.sh"

    # Whether --sarif-file-output survives --report is undocumented, so the
    # script treats a missing or empty file as "nothing to upload".
    - name: Prepare SARIF
      if: always() && inputs.upload-sarif == 'true'
      shell: bash
      id: sarif
      working-directory: ${{ inputs.working-directory }}
      env:
        SARIF_FILE: snyk-iac.sarif
        SARIF_CATEGORY: ${{ inputs.comment-marker }}
      run: python3 "${{ github.action_path }}/../scripts/sarif-prep.py"

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true' && steps.sarif.outputs.ok == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.working-directory }}/snyk-iac.sarif
        # Must be unique per scan: one analysis per category.
        category: ${{ inputs.comment-marker }}
        checkout_path: ${{ github.workspace }}/${{ inputs.working-directory }}
        token: ${{ inputs.github-token }}

    - name: Gate
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.code }}
        MESSAGE: ${{ steps.diag.outputs.message }}
        HINT: ${{ steps.diag.outputs.hint }}
        FAIL_ON: ${{ inputs.fail-on-findings }}
        SEVERITY: ${{ inputs.severity-threshold }}
      run: |
        # Fail closed: unknown exit codes must never look clean.
        case "${CODE:-none}" in
          0)
            echo "IaC: clean." ;;
          3)
            echo "IaC: nothing to scan." ;;
          1)
            if [ "$FAIL_ON" = "true" ]; then
              echo "::error::IaC: findings at ${SEVERITY}+ severity."; exit 1
            fi
            echo "IaC: findings reported, not gated here." ;;
          *)
            echo "::error::${MESSAGE:-IaC: scan failed (exit ${CODE:-unknown}).} ${HINT}"
            exit 1 ;;
        esac
